<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What Am I Doing 设置</title>
  <link rel="stylesheet" href="m3.css">
</head>
<body>
  <form class="settings-form" id="settings-form">
    <h1 class="headline">What Am I Doing</h1>
    <label class="md-switch">
      <input type="checkbox" id="enabled">
      <span>共享前台状态</span>
    </label>

    <div class="md-field">
      <label for="server_url">服务端地址</label>
      <input id="server_url" type="url" placeholder="https://waid.example.com" required>
    </div>

    <div class="md-field">
      <label for="token">设备 Token（管理面板添加设备后复制）</label>
      <input id="token" type="password" required>
    </div>

    <div class="md-field">
      <label for="interval_secs">上报间隔（秒）</label>
      <input id="interval_secs" type="number" min="1" max="60">
      <p class="field-hint">须小于服务端「离线判定」阈值（默认 30 秒），否则会被误判为离线</p>
    </div>

    <div class="actions">
      <span class="saved-hint" id="saved-hint" hidden>已保存 ✓</span>
      <button type="submit" class="md-button md-button--filled">保存</button>
    </div>
    <p class="error-text" id="error" hidden></p>
  </form>
  <script src="app.js"></script>
</body>
</html>
