name: release

# 推送 v* 标签（如 v0.1.0）或手动触发 → 构建并发布 Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ============ 服务端：Go 二进制 ============
  server:
    name: Server binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build server binaries
        working-directory: server
        run: |
          set -e
          for target in linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" \
              -o "whatamidoing-server-${target//\//-}" ./cmd/server
          done
          ls -lh whatamidoing-server-*

      - name: Attach server binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: server/whatamidoing-server-*

  # ============ 服务端：Docker 镜像（GHCR）============
  server-docker:
    name: Server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/whatamidoing-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/whatamidoing-server:latest

  # ============ 桌面端：Linux（deb + AppImage）============
  desktop-linux:
    name: Desktop · Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libfuse2

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri

      - name: Build & attach (.deb / .AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "whatamidoing ${{ github.ref_name }}"
          releaseBody: |
            ## whatamidoing ${{ github.ref_name }}

            让朋友实时看到你电脑/手机的前台在干什么。

            **服务端**：`server/whatamidoing-server-linux-*` 或 Docker 镜像
            `ghcr.io/${{ github.repository_owner }}/whatamidoing-server`
            （用法见仓库 README）。

            **桌面客户端**：`.AppImage` 直接 `chmod +x` 运行；`.deb` 直接安装。
            **Windows**：`.msi` 安装包。**macOS**：`.dmg`。
            **安卓**：`app-release.apk` 直接安装。

            首次运行桌面/安卓客户端，在设置里填服务端地址与上报 token 即可。
          releaseDraft: true
          prerelease: false

  # ============ 桌面端：Windows（NSIS）============
  desktop-windows:
    name: Desktop · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri

      - name: Build & attach (.msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "whatamidoing ${{ github.ref_name }}"
          releaseDraft: true

  # ============ 桌面端：macOS（dmg）============
  desktop-macos:
    name: Desktop · macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri

      - name: Build & attach (.dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "whatamidoing ${{ github.ref_name }}"
          releaseDraft: true

  # ============ 安卓：APK ============
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: clients/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: clients/android/app/build/outputs/apk/release/*.apk
