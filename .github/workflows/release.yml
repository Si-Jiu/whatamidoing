name: release

# 推送 v* 标签（如 v0.1.0）或手动触发 → 构建并发布 Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ============ Release Notes：先建 Release，描述含“上个 tag → 本 tag”全部提交 ============
  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog from commits
        id: changelog
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::notice::非 tag 触发（workflow_dispatch），跳过创建 Release"
            exit 0
          fi

          # 上一个 tag：当前提交（刚推送的 tag）的祖先上最近的可达 tag
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)"

          cat > changelog.md <<'EOF'
          ## whatamidoing ${{ github.ref_name }}
          
          让朋友实时看到你电脑/手机的前台在干什么。
          
          **服务端**：`server/whatamidoing-server-linux-*` 或 Docker 镜像
          `ghcr.io/${{ github.repository_owner }}/whatamidoing-server`
          （用法见仓库 README）。
          
          **桌面客户端**：`.AppImage` 直接 `chmod +x` 运行；`.deb` 直接安装。
          **Windows**：`.msi` 安装包。**macOS**：`.dmg`。
          **安卓**：`whatamidoing_<ver>_android.apk` 直接安装。
          
          首次运行桌面/安卓客户端，在设置里填服务端地址与上报 token 即可。
          
          ---
          
          EOF

          # 提交记录：上个 tag → 本 tag（首次发布则列出全部提交）
          if [[ -n "$PREV_TAG" ]]; then
            echo "### 提交记录（$PREV_TAG → $GITHUB_REF_NAME）" >> changelog.md
            git log --format="* %h %s" "$PREV_TAG"..HEAD >> changelog.md
          else
            echo "### 提交记录（首次发布，含全部历史提交）" >> changelog.md
            git log --format="* %h %s" >> changelog.md
          fi

      - name: Create draft release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "whatamidoing $GITHUB_REF_NAME" \
              --notes-file changelog.md \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============ 服务端：Go 二进制 ============
  server:
    name: Server binaries
    needs: release-notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build server binaries
        working-directory: server
        run: |
          set -e
          for target in linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" \
              -o "whatamidoing-server-${target//\//-}" ./cmd/server
          done
          ls -lh whatamidoing-server-*

      - name: Attach server binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: server/whatamidoing-server-*

  # ============ 服务端：Docker 镜像（GHCR）============
  server-docker:
    name: Server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 多架构构建：QEMU 提供 arm64 模拟，buildx 打双架构 manifest
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 镜像名必须全小写，故将 owner 转小写后拼标签
      - name: Lowercase image owner
        id: lower
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          # Go 服务端 CGO_ENABLED=0 静态编译，可同时出 x86_64 / arm64
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.lower.outputs.owner }}/whatamidoing-server:${{ github.ref_name }}
            ghcr.io/${{ steps.lower.outputs.owner }}/whatamidoing-server:latest

  # ============ 桌面端：Linux（deb + AppImage）============
  desktop-linux:
    name: Desktop · Linux
    needs: release-notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libfuse2

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri

      # 产物文件名里的版本号取自 tauri.conf.json，需与 release 标签一致
      - name: Set version from git tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e 'const fs=require("fs");const p="clients/desktop/src-tauri/tauri.conf.json";const d=JSON.parse(fs.readFileSync(p));d.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(d,null,2)+"\n");' "$VER"
          echo "tauri.conf.json version -> $(node -e 'console.log(require("./clients/desktop/src-tauri/tauri.conf.json").version)')"

      - name: Build & attach (.deb / .AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "whatamidoing ${{ github.ref_name }}"
          releaseBody: |
            ## whatamidoing ${{ github.ref_name }}

            让朋友实时看到你电脑/手机的前台在干什么。

            **服务端**：`server/whatamidoing-server-linux-*` 或 Docker 镜像
            `ghcr.io/${{ github.repository_owner }}/whatamidoing-server`
            （用法见仓库 README）。

            **桌面客户端**：`.AppImage` 直接 `chmod +x` 运行；`.deb` 直接安装。
            **Windows**：`.msi` 安装包。**macOS**：`.dmg`。
            **安卓**：`whatamidoing_<ver>_android.apk` 直接安装。

            首次运行桌面/安卓客户端，在设置里填服务端地址与上报 token 即可。
          releaseDraft: true
          prerelease: false

  # ============ 桌面端：Windows（NSIS）============
  desktop-windows:
    name: Desktop · Windows
    needs: release-notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri

      # 产物文件名里的版本号取自 tauri.conf.json，需与 release 标签一致
      - name: Set version from git tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e 'const fs=require("fs");const p="clients/desktop/src-tauri/tauri.conf.json";const d=JSON.parse(fs.readFileSync(p));d.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(d,null,2)+"\n");' "$VER"

      - name: Build & attach (.msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "whatamidoing ${{ github.ref_name }}"
          releaseDraft: true

  # ============ 桌面端：macOS（dmg）============
  desktop-macos:
    name: Desktop · macOS
    needs: release-notes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri

      # 产物文件名里的版本号取自 tauri.conf.json，需与 release 标签一致
      - name: Set version from git tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          node -e 'const fs=require("fs");const p="clients/desktop/src-tauri/tauri.conf.json";const d=JSON.parse(fs.readFileSync(p));d.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(d,null,2)+"\n");' "$VER"

      - name: Build & attach (.dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "whatamidoing ${{ github.ref_name }}"
          releaseDraft: true

  # ============ 安卓：APK ============
  android:
    name: Android APK
    needs: release-notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: clients/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK to match version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mv clients/android/app/build/outputs/apk/release/app-release.apk \
             "clients/android/app/build/outputs/apk/release/whatamidoing_${VER}_android.apk"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: clients/android/app/build/outputs/apk/release/*.apk
