services:
  whatamidoing:
    image: ghcr.io/si-jiu/whatamidoing-server:latest
    container_name: whatamidoing
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 必填：设备上报 token（与客户端配置一致）
      REPORT_TOKEN: "YOUR_TOKEN"
      # 可选：网页密码
      VIEWER_PASSWORD: "YOUR_PASSWORD"
      # 可选：离线判定阈值
      IDLE_TIMEOUT: "30s"
